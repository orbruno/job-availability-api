name: Bug report
description: Report a reproducible problem with the self-hosted API
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Remove credentials, posting URLs, page content, workflow payloads, filesystem contents, and personal data before submitting. Use private security reporting for vulnerabilities.
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This report contains no secrets or personal data.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: input
    id: version
    attributes:
      label: API version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: 24.19.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment type
      options:
        - Docker Compose
        - Direct Node.js process
        - Other private container deployment
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and version
      description: For example, the n8n version and community-node version.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic values and the smallest reproducible request or workflow.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized problem codes and messages only.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Describe the private network topology, filesystem type, and recent changes without revealing sensitive paths or data.
