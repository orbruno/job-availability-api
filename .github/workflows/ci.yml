name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.22.0
          - 24.19.0

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.6.2 --ignore-scripts

      - name: Confirm toolchain
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate source and runtime
        run: npm run check:runtime

      - name: Audit production dependencies
        if: matrix.node-version == '24.19.0'
        run: npm audit --omit=dev --audit-level=high

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - name: Validate Compose configuration
        env:
          JOB_AVAILABILITY_COMPOSE_TOKEN_FILE: /tmp/job-availability-token
        run: docker compose config --quiet

      - name: Build container
        run: docker build --tag job-availability-api:ci .
